<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — Advance Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase MUST load in head before any script uses it -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDgyBh_OWjnIpok3gR9LUsT0CAqGK6FVao",
  authDomain:"advance-plus-form.firebaseapp.com",
  projectId:"advance-plus-form",
  storageBucket:"advance-plus-form.firebasestorage.app",
  messagingSenderId:"130477031774",
  appId:"1:130477031774:web:09345e091812be63d04fcf"
});
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
auth.onAuthStateChanged(u => { if(u) location.href = 'index.html'; });
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Kanit',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
  background:#1a3a28;
  background-image:url('img/background.png');
  background-size:cover;background-position:center;background-attachment:fixed;
}
body::before{
  content:'';position:fixed;inset:0;
  background:rgba(0,0,0,.4);z-index:0;
}
.card{
  position:relative;z-index:1;
  width:100%;max-width:380px;
  background:#fff;border-radius:22px;
  box-shadow:0 16px 56px rgba(0,0,0,.3);
  overflow:hidden;
  animation:up .4s cubic-bezier(.22,.68,0,1.15);
}
@keyframes up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.banner{
  background:linear-gradient(135deg,#14532d,#15803d 60%,#16a34a);
  padding:1.75rem 1.5rem 1.6rem;text-align:center;position:relative;overflow:hidden;
}
.banner::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.12),transparent 60%);}
.logo-box{
  width:62px;height:62px;border-radius:14px;
  background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.22);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:.65rem;overflow:hidden;
}
.logo-box img{width:100%;height:100%;object-fit:contain;padding:6px;}
.banner h1{font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:.02em;}
.banner p{font-size:.7rem;color:rgba(255,255,255,.72);margin-top:.18rem;letter-spacing:.07em;}
.body{padding:1.6rem 1.6rem 1.4rem;}
.fg{margin-bottom:.9rem;}
.fg label{display:block;font-size:.73rem;font-weight:600;color:#4b6b4b;margin-bottom:.32rem;}
.iw{position:relative;}
.iw svg.ic{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:#86efac;pointer-events:none;}
.iw input{
  width:100%;height:44px;padding:.55rem 2.6rem;
  border:1.5px solid #d1e8d1;border-radius:11px;
  background:#f8fffe;color:#1a2e1a;
  font-family:'Kanit',sans-serif;font-size:.86rem;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.iw input:focus{border-color:#22c55e;background:#fff;box-shadow:0 0 0 3px rgba(34,197,94,.11);}
.iw .eye{
  position:absolute;right:.8rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#86efac;
  display:flex;align-items:center;transition:color .18s;padding:.15rem;
}
.iw .eye:hover{color:#16a34a;}
.err{font-size:.7rem;color:#dc2626;margin-top:.3rem;display:none;align-items:center;gap:.28rem;}
.err.on{display:flex;}
.btn{
  width:100%;height:46px;margin-top:.35rem;
  background:linear-gradient(135deg,#14532d,#15803d 55%,#22c55e);
  border:none;border-radius:12px;color:#fff;
  font-family:'Kanit',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:.04em;
  cursor:pointer;box-shadow:0 4px 14px rgba(22,101,52,.28);
  transition:transform .14s,opacity .14s;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);opacity:.88;}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.foot{text-align:center;font-size:.64rem;color:#9ab89a;padding:.55rem 0 .15rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .55s linear infinite;vertical-align:middle;margin-right:.35rem;}
</style>
</head>
<body>
<div class="card">
  <div class="banner">
    <div class="logo-box">
      <img src="img/logo.png" alt="logo" onerror="this.parentElement.textContent='🌿'">
    </div>
    <h1>Advance Plus</h1>
    <p>GREEN ENERGY CUSTOMER SERVICE</p>
  </div>
  <div class="body">
    <div class="fg">
      <label>อีเมล</label>
      <div class="iw">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        <input type="email" id="em" placeholder="your@email.com" autocomplete="email"
          oninput="clrErr()" onkeydown="if(event.key==='Enter')go()">
      </div>
    </div>
    <div class="fg">
      <label>รหัสผ่าน</label>
      <div class="iw">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password"
          oninput="clrErr()" onkeydown="if(event.key==='Enter')go()">
        <button class="eye" type="button" onclick="togglePw()">
          <svg id="eyeIco" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="err" id="errEl">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="#dc2626"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16v.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span id="errTxt"></span>
      </div>
    </div>
    <button class="btn" id="loginBtn" onclick="go()">เข้าสู่ระบบ</button>
    <div class="foot">© 2026 Advance Plus · Green Energy CRM</div>
  </div>
</div>
<script>
let pwOn=false;
function togglePw(){
  pwOn=!pwOn;
  document.getElementById('pw').type=pwOn?'text':'password';
  document.getElementById('eyeIco').innerHTML=pwOn
    ?`<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
       <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
       <line x1="1" y1="1" x2="23" y2="23"/>`
    :`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}
async function go(){
  const email=document.getElementById('em').value.trim();
  const pass=document.getElementById('pw').value;
  if(!email||!pass){showErr('กรุณากรอกอีเมลและรหัสผ่าน');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>กำลังเข้าสู่ระบบ...';
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){
    btn.disabled=false;btn.textContent='เข้าสู่ระบบ';
    const m=e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'
      ?'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
      :e.code==='auth/too-many-requests'?'พยายามเข้าบ่อยเกินไป กรุณารอสักครู่'
      :'เกิดข้อผิดพลาด: '+e.message;
    showErr(m);
  }
}
function showErr(m){document.getElementById('errTxt').textContent=m;document.getElementById('errEl').classList.add('on');}
function clrErr(){document.getElementById('errEl').classList.remove('on');}
</script>
</body>
</html>
