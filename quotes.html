<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใบเสนอราคา — Advance Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --white:#fff; --card:#fff;
  --g-dk:#15803d; --g-md:#16a34a; --g-lt:#22c55e;
  --g-pale:#dcfce7; --txt:#1a2e1a; --txt-2:#4b6b4b; --txt-dim:#9ab89a;
  --border:#d1e8d1; --shadow:0 1px 4px rgba(0,0,0,.07),0 4px 20px rgba(0,0,0,.05);
  --btn:linear-gradient(135deg,#14532d,#16a34a);
  --head-bg:#166534; --row-alt:#f8fbf8; --row-hover:#edf7ed;
  --inp:#f4f8f4; --inp-c:#1a2e1a; --inp-bd:#c8dfc8;
}
[data-theme="dark"]{
  --bg:#0f1a12; --white:#1a2d1e; --card:#1f3424;
  --g-dk:#4ade80; --g-md:#34d399; --g-lt:#6ee7b7;
  --g-pale:rgba(74,222,128,.15); --txt:#e8f5e8; --txt-2:#a7d4a7; --txt-dim:#6b9a6b;
  --border:#2a4a2a; --shadow:0 1px 4px rgba(0,0,0,.4),0 4px 20px rgba(0,0,0,.35);
  --btn:linear-gradient(135deg,#14532d,#15803d);
  --head-bg:#122518; --row-alt:rgba(255,255,255,.03); --row-hover:rgba(74,222,128,.08);
  --inp:#162a1a; --inp-c:#e8f5e8; --inp-bd:#2a4a2a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Kanit',sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);font-size:15px;}

.topbar{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;background:var(--white);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:0;z-index:100;}
.logo{width:34px;height:34px;border-radius:10px;background:var(--btn);display:grid;place-items:center;font-size:1.05rem;flex-shrink:0;}
.title{font-size:.88rem;font-weight:700;color:var(--g-dk);flex:1;}
.title small{display:block;font-size:.62rem;font-weight:400;color:var(--txt-dim);}
.tbtn{height:30px;padding:0 .7rem;border-radius:8px;border:1px solid var(--border);background:var(--inp);color:var(--txt-2);font-family:'Kanit',sans-serif;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .18s;}
.tbtn:hover{border-color:var(--g-md);color:var(--g-md);}
.user{font-size:.67rem;color:var(--txt-dim);white-space:nowrap;}

.toolbar{display:flex;align-items:center;gap:.5rem;padding:.75rem 1.1rem;flex-wrap:wrap;}
.search{flex:1;min-width:220px;position:relative;}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--txt-dim);}
.search input{width:100%;height:42px;padding:.3rem .8rem .3rem 2.3rem;border:1px solid var(--inp-bd);border-radius:10px;background:var(--white);color:var(--inp-c);font-family:'Kanit',sans-serif;font-size:.88rem;outline:none;transition:border-color .18s;}
.search input:focus{border-color:var(--g-md);box-shadow:0 0 0 3px rgba(22,163,74,.1);}
.search input::placeholder{color:var(--txt-dim);}
.rcount{font-size:.75rem;color:var(--txt-dim);white-space:nowrap;font-weight:600;}

.twrap{padding:0 1.1rem 3rem;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
thead tr{background:var(--head-bg);}
thead th{padding:.85rem .9rem;text-align:left;color:#fff;font-weight:700;font-size:.75rem;white-space:nowrap;letter-spacing:.02em;position:sticky;top:0;background:var(--head-bg);z-index:5;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:nth-child(even){background:var(--row-alt);}
tbody tr:hover{background:var(--row-hover);}
td{padding:.75rem .9rem;vertical-align:top;line-height:1.5;}
td.wrap{white-space:normal;min-width:220px;}
td.nowrap{white-space:nowrap;}
.no-data{text-align:center;padding:4rem 1rem;color:var(--txt-dim);font-size:.9rem;}
.loading{text-align:center;padding:4rem 1rem;color:var(--txt-dim);font-size:.9rem;}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(12px);background:var(--white);border:1px solid var(--g-lt);border-radius:12px;padding:.55rem 1.1rem;font-size:.8rem;color:var(--txt);box-shadow:var(--shadow);z-index:300;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.img-btn{background:#dcfce7;border:1px solid #16a34a;color:#15803d;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.72rem;font-weight:700;white-space:nowrap;}
.img-btn:hover{background:#bbf7d0;}
.img-none{color:var(--txt-dim);font-size:.7rem;}
[data-theme="dark"] .img-btn{background:rgba(74,222,128,.15);border-color:#34d399;color:#4ade80;}

.lbx{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;display:none;place-items:center;}
.lbx.on{display:grid;}
.lbx img{max-width:94vw;max-height:90vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);}
.lbx-close{position:absolute;top:1rem;right:1.2rem;font-size:1.6rem;color:#fff;cursor:pointer;background:none;border:none;line-height:1;z-index:9999;}

.row-actions{display:flex;gap:.35rem;}
.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--inp);cursor:pointer;font-size:.8rem;display:grid;place-items:center;transition:all .15s;}
.act-btn:hover{border-color:var(--g-md);}
.act-edit:hover{background:#dbeafe;border-color:#93c5fd;}
.act-del{color:#b91c1c;}
.act-del:hover{background:#fee2e2;border-color:#fca5a5;}

.overlay{position:fixed;inset:0;background:rgba(15,30,15,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;}
.overlay.on{opacity:1;pointer-events:auto;}
.modal{position:fixed;inset:0;z-index:201;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
.msheet{width:100%;max-width:620px;max-height:94vh;background:var(--white);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.15);overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.68,0,1.1);pointer-events:auto;}
.msheet.on{transform:translateY(0);}
.mhandle{width:36px;height:4px;border-radius:4px;background:var(--border);margin:.7rem auto .3rem;}
.mhead{display:flex;align-items:center;gap:.5rem;padding:.65rem 1.2rem;border-bottom:1px solid var(--border);}
.mtitle{font-size:.92rem;font-weight:700;flex:1;}
.mclose{width:28px;height:28px;border-radius:50%;border:none;background:var(--inp);cursor:pointer;font-size:.8rem;color:var(--txt-dim);}
.mbody{padding:.9rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.65rem;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;}
@media(max-width:420px){.mgrid{grid-template-columns:1fr;}}
.mfg label{font-size:.68rem;font-weight:600;color:var(--txt-dim);margin-bottom:.18rem;display:block;}
.mfg input,.mfg select,.mfg textarea{width:100%;padding:.52rem .75rem;border:1px solid var(--inp-bd);border-radius:9px;background:var(--inp);color:var(--inp-c);font-family:'Kanit',sans-serif;font-size:.78rem;outline:none;transition:border-color .18s,box-shadow .18s;}
.mfg input:focus,.mfg select:focus,.mfg textarea:focus{border-color:var(--g-md);box-shadow:0 0 0 3px rgba(22,163,74,.1);}
.mfg textarea{resize:vertical;min-height:58px;line-height:1.5;}
.msec{font-size:.63rem;font-weight:800;letter-spacing:.08em;color:var(--g-md);text-transform:uppercase;padding:.3rem 0 .05rem;border-bottom:1px solid var(--border);margin-top:.15rem;}
.item-row{display:grid;grid-template-columns:1fr 55px 90px 90px 28px;gap:.35rem;align-items:center;margin-bottom:.4rem;}
.item-row input{padding:.4rem .55rem;border:1px solid var(--inp-bd);border-radius:7px;background:var(--inp);color:var(--inp-c);font-family:'Kanit',sans-serif;font-size:.74rem;outline:none;}
.item-amt{font-size:.75rem;font-weight:700;color:var(--g-dk);text-align:right;padding-right:.3rem;}
.item-rm{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fef2f2;color:#b91c1c;cursor:pointer;font-size:.75rem;}
@media(max-width:480px){.item-row{grid-template-columns:1fr;gap:.25rem;}}
.mfoot{display:flex;gap:.5rem;padding:.6rem 1.2rem 1rem;border-top:1px solid var(--border);}
.mfbtn{flex:1;height:40px;border-radius:10px;border:none;font-family:'Kanit',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .18s;}
.mf-save{background:var(--btn);color:#fff;}
.mf-save:hover{opacity:.9;}
.mf-cancel{background:var(--inp);color:var(--txt-2);border:1px solid var(--inp-bd)!important;}


</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📄</div>
  <div class="title">ใบเสนอราคา <small>Advance Plus CRM</small></div>
  <span class="user" id="userEl"></span>
  <button class="tbtn" onclick="location.href='data.html'">📋 กลับหน้าข้อมูลลูกค้า</button>
  <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  <button class="tbtn" onclick="doLogout()">ออก</button>
</div>

<div class="toolbar">
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchEl" placeholder="ค้นหาชื่อ, เลขผู้เสียภาษี, เบอร์โทร, ช่องทาง, ระบบที่สนใจ, หมายเหตุ..." oninput="applyFilter()">
  </div>
  <span class="rcount" id="rcountEl">—</span>
</div>

<div class="twrap">
  <table>
    <thead>
      <tr>
        <th style="width:3%;">#</th>
        <th style="width:7%;">วันที่</th>
        <th style="width:12%;">ชื่อลูกค้า</th>
        <th style="width:10%;">เลขผู้เสียภาษี</th>
        <th style="width:8%;">เบอร์โทร</th>
        <th style="width:8%;">ช่องทางติดต่อ</th>
        <th style="width:19%;">ระบบที่สนใจ</th>
        <th style="width:13%;">เพิ่มเติม</th>
        <th style="width:7%;">ผู้กรอก</th>
        <th style="width:6%;">รูปภาพ</th>
        <th style="width:7%;">จัดการ</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="11" class="loading">⏳ กำลังโหลดข้อมูล...</td></tr>
    </tbody>
  </table>
</div>

<div class="lbx" id="lbx" onclick="this.classList.remove('on')"></div>

<div class="overlay" id="ov" onclick="closeModal()"></div>
<div class="modal"><div class="msheet" id="ms">
  <div class="mhandle"></div>
  <div class="mhead">
    <div class="mtitle">✏️ แก้ไขใบเสนอราคา</div>
    <button class="mclose" onclick="closeModal()">✕</button>
  </div>
  <div class="mbody">
    <div class="mfg"><label>ชื่อ - นามสกุล / ชื่อบริษัท</label><input id="e_name"></div>
    <div class="mgrid">
      <div class="mfg"><label>เลขผู้เสียภาษี</label><input id="e_tax" maxlength="13"></div>
      <div class="mfg"><label>เบอร์โทร</label><input id="e_phone" maxlength="10"></div>
    </div>
    <div class="mfg"><label>ช่องทางติดต่อ</label>
      <select id="e_channel">
        <option value="โทรศัพท์">โทรศัพท์</option>
        <option value="Line Official">Line / Line OA</option>
        <option value="Facebook">Facebook Messenger</option>
        <option value="อีเมล">อีเมล</option>
      </select>
    </div>
    <div class="mfg"><label>ระบบที่สนใจ / รายละเอียดงาน</label><textarea id="e_problem"></textarea></div>
    <div class="mfg"><label>เพิ่มเติม</label><textarea id="e_note"></textarea></div>

    <div class="msec">💰 รายการสินค้า/บริการ (สำหรับพิมพ์ใบเสนอราคา)</div>
    <div id="itemsWrap"></div>
    <button type="button" class="tbtn" style="align-self:flex-start;" onclick="addItemRow()">➕ เพิ่มรายการ</button>

    <div class="mgrid" style="margin-top:.3rem;">
      <div class="mfg"><label>ยืนราคา (วัน)</label><input id="e_validDays" type="number" min="1" value="30"></div>
      <div class="mfg" style="display:flex; align-items:flex-end; gap:.4rem; padding-bottom:.5rem;">
        <input type="checkbox" id="e_vat" checked style="width:auto;"> <label style="margin:0;">คิดภาษีมูลค่าเพิ่ม (VAT 7%)</label>
      </div>
    </div>
    <div id="totalsBox" style="background:var(--inp); border-radius:10px; padding:.7rem .9rem; font-size:.8rem; line-height:1.8;"></div>
  </div>
  <div class="mfoot">
    <button class="mfbtn mf-cancel" onclick="closeModal()">ยกเลิก</button>
    <button class="mfbtn mf-save" id="saveBtn" onclick="saveQuote()">💾 บันทึก</button>
    <button class="mfbtn" style="background:#dbeafe; color:#1d4ed8; flex:.8;" onclick="saveQuote(true)">🖨️ บันทึก & พิมพ์</button>
  </div>
</div></div>


<div class="toast" id="toastEl"></div>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDgyBh_OWjnIpok3gR9LUsT0CAqGK6FVao",
  authDomain:"advance-plus-form.firebaseapp.com",
  projectId:"advance-plus-form",
  storageBucket:"advance-plus-form.firebasestorage.app",
  messagingSenderId:"130477031774",
  appId:"1:130477031774:web:09345e091812be63d04fcf"
});
const auth=firebase.auth(), db=firebase.firestore();

let quotes=[], filtered=[], unsub=null, editId=null;

auth.onAuthStateChanged(async u=>{
  if(!u){location.href='login.html';return;}
  document.getElementById('userEl').textContent='👤 '+(u.displayName||u.email.split('@')[0]);
  try{
    const rd = await db.collection('roles').doc(u.email.toLowerCase()).get();
    window._userRole = rd.exists ? (rd.data().role || 'staff') : 'staff';
  }catch(e){ window._userRole = 'staff'; }
  loadQuotes();
});

function doLogout(){auth.signOut().then(()=>location.href='login.html');}

// Theme
(()=>{
  const t=localStorage.getItem('adv-theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';
  });
})();
function toggleTheme(){
  const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('adv-theme',n);
  document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';
}

function toast(m){
  const e=document.getElementById('toastEl');
  e.textContent=m; e.classList.add('on');
  clearTimeout(window._qtt);
  window._qtt=setTimeout(()=>e.classList.remove('on'),3000);
}

function loadQuotes(){
  unsub = db.collection('customers').where('type','==','Quote').onSnapshot(snap=>{
    quotes = snap.docs.map(d=>({...d.data(), _id:d.id}));
    quotes.sort((a,b)=>{
      const ta = a.timestamp?.toDate ? a.timestamp.toDate().getTime() : 0;
      const tb = b.timestamp?.toDate ? b.timestamp.toDate().getTime() : 0;
      return tb - ta; // ใหม่ ➔ เก่า
    });
    applyFilter();
  }, err=>{
    console.error(err);
    toast('⚠️ โหลดข้อมูลไม่สำเร็จ: '+err.message);
  });
}

function applyFilter(){
  const q = (document.getElementById('searchEl').value || '').trim().toLowerCase();
  if(!q){
    filtered = quotes;
  } else {
    filtered = quotes.filter(d=>{
      const hay = [
        d.name, d.tax, d.phone, d.channel, d.problem, d.note, d.submittedBy
      ].map(v=>(v||'').toString().toLowerCase()).join(' | ');
      return hay.includes(q);
    });
  }
  render();
}

function esc(s){
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

function render(){
  const tbody = document.getElementById('tbody');
  document.getElementById('rcountEl').textContent = `ทั้งหมด ${filtered.length} รายการ`;

  if(filtered.length===0){
    tbody.innerHTML = `<tr><td colspan="11" class="no-data">📭 ไม่พบรายการใบเสนอราคา</td></tr>`;
    return;
  }

  const canDelete = window._userRole === 'admin';

  tbody.innerHTML = filtered.map((d,i)=>{
    const dateStr = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleDateString('th-TH') : '-';
    const imgs = d.images?.cc || [];
    const imgCell = imgs.length > 0
      ? `<button class="img-btn" onclick="openGallery('${d._id}')">🖼️ ดูรูป (${imgs.length})</button>`
      : `<span class="img-none">ไม่มีรูป</span>`;
    const delBtn = canDelete
      ? `<button class="act-btn act-del" title="ลบ" onclick="deleteQuote('${d._id}')">🗑</button>`
      : '';
    return `
      <tr>
        <td class="nowrap">${i+1}</td>
        <td class="nowrap">${esc(dateStr)}</td>
        <td class="wrap"><b>${esc(d.name || '-')}</b></td>
        <td class="nowrap">${esc(d.tax || '-')}</td>
        <td class="nowrap">${esc(d.phone || '-')}</td>
        <td class="nowrap">${esc(d.channel || '-')}</td>
        <td class="wrap">${esc(d.problem || '-')}</td>
        <td class="wrap">${esc(d.note || '-')}</td>
        <td class="nowrap">${esc(d.submittedBy || '-')}</td>
        <td class="nowrap">${imgCell}</td>
        <td class="nowrap"><div class="row-actions">
          <button class="act-btn act-edit" title="แก้ไข" onclick="openEdit('${d._id}')">✏️</button>
          <button class="act-btn" title="พิมพ์ใบเสนอราคา" onclick="printQuote('${d._id}')">🖨️</button>
          ${delBtn}
        </div></td>
      </tr>
    `;
  }).join('');
}

// ── แกลลอรี่ดูรูปภาพ (เหมือนหน้าข้อมูลลูกค้าหลัก) ──
function openGallery(id){
  const d = quotes.find(x => x._id === id);
  if (!d || !d.images || !d.images.cc || d.images.cc.length === 0) return toast('ไม่มีรูปภาพแนบมาครับ');

  const lbx = document.getElementById('lbx');
  const imgsHTML = d.images.cc.map(img =>
    `<img src="${(img.data || img).replace(/'/g,"\\'")}" style="max-height:80vh; max-width:90vw; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.5); margin-bottom: 20px;" onclick="event.stopPropagation()">`
  ).join('');

  lbx.innerHTML = `
      <button class="lbx-close" onclick="document.getElementById('lbx').classList.remove('on')">✕</button>
      <div style="display:flex; flex-direction:column; overflow-y:auto; padding:40px 20px 100px; width:100vw; height:100vh; align-items:center;" onclick="document.getElementById('lbx').classList.remove('on')">
          ${imgsHTML}
      </div>
      <div style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); color:white; font-size:1rem; font-weight:bold; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,0.9); background:rgba(0,0,0,0.7); padding:8px 20px; border-radius:30px; z-index:9999;">
          ↕️ เลื่อนขึ้น-ลง เพื่อดูรูปทั้งหมด (${d.images.cc.length} รูป)
      </div>`;
  lbx.classList.add('on');
}

// ── รายการสินค้า/บริการ (สำหรับใบเสนอราคา) ──
let itemRows = [];

function addItemRow(){
  itemRows.push({desc:'', qty:1, price:0});
  renderItems();
}
function removeItemRow(idx){
  itemRows.splice(idx,1);
  if(itemRows.length===0) itemRows.push({desc:'', qty:1, price:0});
  renderItems();
}
function updateItem(idx, field, val){
  if(field==='desc') itemRows[idx].desc = val;
  else itemRows[idx][field] = parseFloat(val) || 0;
  renderItems();
}
function renderItems(){
  const wrap = document.getElementById('itemsWrap');
  wrap.innerHTML = itemRows.map((it,idx)=>{
    const amt = (it.qty||0) * (it.price||0);
    return `
      <div class="item-row">
        <input placeholder="รายการ" value="${esc(it.desc)}" oninput="updateItem(${idx},'desc',this.value)">
        <input type="number" min="0" placeholder="จำนวน" value="${it.qty}" oninput="updateItem(${idx},'qty',this.value)">
        <input type="number" min="0" placeholder="หน่วยละ" value="${it.price}" oninput="updateItem(${idx},'price',this.value)">
        <div class="item-amt">${amt.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <button type="button" class="item-rm" onclick="removeItemRow(${idx})">✕</button>
      </div>`;
  }).join('');
  updateTotalsBox();
}
function calcTotals(){
  const subtotal = itemRows.reduce((s,it)=>s + (it.qty||0)*(it.price||0), 0);
  const vatOn = document.getElementById('e_vat').checked;
  const vat = vatOn ? subtotal * 0.07 : 0;
  const grand = subtotal + vat;
  return {subtotal, vat, vatOn, grand};
}
function updateTotalsBox(){
  const {subtotal, vat, vatOn, grand} = calcTotals();
  const fmt = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('totalsBox').innerHTML = `
    รวมเป็นเงิน: <b>${fmt(subtotal)}</b> บาท<br>
    ${vatOn ? `ภาษีมูลค่าเพิ่ม 7%: <b>${fmt(vat)}</b> บาท<br>` : ''}
    <span style="color:var(--g-dk); font-size:.95rem;">ยอดรวมทั้งสิ้น: <b>${fmt(grand)}</b> บาท</span>
  `;
}
document.addEventListener('change', e=>{
  if(e.target && e.target.id === 'e_vat') updateTotalsBox();
});

// ── แก้ไขรายการ ──
function openEdit(id){
  const d = quotes.find(x => x._id === id);
  if(!d) return;
  editId = id;
  document.getElementById('e_name').value = d.name || '';
  document.getElementById('e_tax').value = d.tax || '';
  document.getElementById('e_phone').value = d.phone || '';
  document.getElementById('e_channel').value = d.channel || 'โทรศัพท์';
  document.getElementById('e_problem').value = d.problem || '';
  document.getElementById('e_note').value = d.note || '';
  document.getElementById('e_validDays').value = d.validDays || 30;
  document.getElementById('e_vat').checked = d.vat !== false;
  itemRows = (d.items && d.items.length > 0) ? JSON.parse(JSON.stringify(d.items)) : [{desc:'', qty:1, price:0}];
  renderItems();
  document.getElementById('ov').classList.add('on');
  document.getElementById('ms').classList.add('on');
}

function closeModal(){
  document.getElementById('ov').classList.remove('on');
  document.getElementById('ms').classList.remove('on');
  editId = null;
}

async function saveQuote(thenPrint){
  if(!editId) return;
  const btn = document.getElementById('saveBtn');
  const name = document.getElementById('e_name').value.trim();
  const tax = document.getElementById('e_tax').value.trim().replace(/\D/g,'').slice(0,13);
  const phone = document.getElementById('e_phone').value.trim().replace(/\D/g,'').slice(0,10);
  const channel = document.getElementById('e_channel').value;
  const problem = document.getElementById('e_problem').value.trim();
  const note = document.getElementById('e_note').value.trim();
  const validDays = parseInt(document.getElementById('e_validDays').value) || 30;
  const vat = document.getElementById('e_vat').checked;
  const items = itemRows.filter(it => it.desc.trim() !== '' || it.qty > 0 || it.price > 0);

  if(!name) return toast('⚠️ กรุณาระบุชื่อลูกค้า');

  btn.textContent = '⏳ กำลังบันทึก...';
  btn.disabled = true;
  const idToUse = editId;
  try{
    await db.collection('customers').doc(editId).update({
      name, tax, phone, channel, problem, note, validDays, vat, items
    });
    // อัปเดตข้อมูลในหน่วยความจำด้วย จะได้พิมพ์ได้ทันทีโดยไม่ต้องรอ snapshot
    const localIdx = quotes.findIndex(x=>x._id===editId);
    if(localIdx>-1) quotes[localIdx] = {...quotes[localIdx], name, tax, phone, channel, problem, note, validDays, vat, items};
    toast('✅ บันทึกการแก้ไขเรียบร้อยแล้ว');
    closeModal();
    if(thenPrint) printQuote(idToUse);
  }catch(e){
    toast('⚠️ บันทึกไม่สำเร็จ: ' + e.message);
  }
  btn.textContent = '💾 บันทึก';
  btn.disabled = false;
}

// ── ลบรายการ (เฉพาะ admin) ──
async function deleteQuote(id){
  if(window._userRole !== 'admin') return toast('⛔ เฉพาะ Admin เท่านั้นที่ลบได้');
  const d = quotes.find(x => x._id === id);
  if(!d) return;
  if(!confirm(`ลบใบเสนอราคาของ "${d.name || '-'}" ออกจากระบบเลยไหมครับ? (ไม่สามารถกู้คืนได้)`)) return;
  try{
    await db.collection('customers').doc(id).delete();
    toast('✅ ลบรายการเรียบร้อยแล้ว');
  }catch(e){
    toast('⚠️ ลบไม่สำเร็จ: ' + e.message);
  }
}

// ── พิมพ์เป็นใบเสนอราคาจริง (ใช้ window.print แบบ DOM API ไม่ใช้ document.write เพื่อกันปัญหาสระไทยเพี้ยนและ extension บล็อก) ──
function esc2(s){ return esc(s); }

function printQuote(id){
  const d = quotes.find(x => x._id === id);
  if(!d) return;

  const items = (d.items && d.items.length > 0) ? d.items : [];
  const hasPricing = items.some(it => (it.desc||'').trim() !== '' || (it.qty||0) > 0 || (it.price||0) > 0);

  const dateObj = d.timestamp?.toDate ? d.timestamp.toDate() : new Date();
  const dateStr = dateObj.toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'});
  const quoteNo = `QT-${dateObj.getFullYear()+543}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}-${(id||'').slice(-5).toUpperCase()}`;
  const validDays = d.validDays || 30;

  const subtotal = items.reduce((s,it)=>s + (it.qty||0)*(it.price||0), 0);
  const vatOn = d.vat !== false;
  const vat = vatOn ? subtotal * 0.07 : 0;
  const grand = subtotal + vat;
  const fmt = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

  const itemRowsHTML = hasPricing ? items.map((it,i)=>`
    <tr>
      <td style="text-align:center; padding:8px; border:1px solid #ccc;">${i+1}</td>
      <td style="padding:8px; border:1px solid #ccc;">${esc2(it.desc||'-')}</td>
      <td style="text-align:center; padding:8px; border:1px solid #ccc;">${it.qty||0}</td>
      <td style="text-align:right; padding:8px; border:1px solid #ccc;">${fmt(it.price||0)}</td>
      <td style="text-align:right; padding:8px; border:1px solid #ccc;">${fmt((it.qty||0)*(it.price||0))}</td>
    </tr>
  `).join('') : `
    <tr><td colspan="5" style="text-align:center; padding:16px; border:1px solid #ccc; color:#888;">
      (ยังไม่ได้ระบุรายการสินค้า/บริการ — กด ✏️ แก้ไข เพื่อเพิ่มรายการและราคา)
    </td></tr>
  `;

  const bodyHTML = `
    <div style="font-family:Tahoma,'Leelawadee UI',Arial,sans-serif; padding:28px 34px; color:#1a2e1a;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #16a34a; padding-bottom:14px; margin-bottom:20px;">
        <div>
          <div style="font-size:22pt; font-weight:700; color:#15803d;">Advance Plus</div>
          <div style="font-size:9pt; color:#4b6b4b; margin-top:2px;">Green Energy Solutions</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:16pt; font-weight:700; color:#166534;">ใบเสนอราคา</div>
          <div style="font-size:9pt; color:#4b6b4b;">QUOTATION</div>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; gap:20px; margin-bottom:18px;">
        <div style="flex:1;">
          <div style="font-size:9pt; font-weight:700; color:#166534; margin-bottom:4px;">เรียน / ลูกค้า</div>
          <div style="font-size:11pt; font-weight:700;">${esc2(d.name||'-')}</div>
          <div style="font-size:9.5pt; color:#4b6b4b; margin-top:2px;">เลขผู้เสียภาษี: ${esc2(d.tax||'-')}</div>
          <div style="font-size:9.5pt; color:#4b6b4b;">โทร: ${esc2(d.phone||'-')} | ช่องทาง: ${esc2(d.channel||'-')}</div>
        </div>
        <div style="text-align:right; font-size:9.5pt; color:#4b6b4b;">
          <div>เลขที่: <b>${quoteNo}</b></div>
          <div>วันที่: ${dateStr}</div>
          <div>ยืนราคา: ${validDays} วัน</div>
        </div>
      </div>

      <div style="background:#f4f8f4; border-radius:8px; padding:10px 14px; margin-bottom:18px; font-size:9.5pt;">
        <b>รายละเอียดที่สนใจ:</b> ${esc2(d.problem||'-')}
        ${d.note ? `<br><b>เพิ่มเติม:</b> ${esc2(d.note)}` : ''}
      </div>

      <table style="width:100%; border-collapse:collapse; font-size:9.5pt; margin-bottom:4px;">
        <thead>
          <tr style="background:#166534; color:#fff;">
            <th style="padding:8px; border:1px solid #166534; width:5%;">ลำดับ</th>
            <th style="padding:8px; border:1px solid #166534; text-align:left;">รายการ</th>
            <th style="padding:8px; border:1px solid #166534; width:10%;">จำนวน</th>
            <th style="padding:8px; border:1px solid #166534; width:15%;">หน่วยละ (บาท)</th>
            <th style="padding:8px; border:1px solid #166534; width:15%;">จำนวนเงิน (บาท)</th>
          </tr>
        </thead>
        <tbody>${itemRowsHTML}</tbody>
      </table>

      <div style="display:flex; justify-content:flex-end; margin-bottom:24px;">
        <table style="width:280px; font-size:9.5pt;">
          <tr><td style="padding:4px 8px;">รวมเป็นเงิน</td><td style="padding:4px 8px; text-align:right;">${fmt(subtotal)}</td></tr>
          ${vatOn ? `<tr><td style="padding:4px 8px;">ภาษีมูลค่าเพิ่ม 7%</td><td style="padding:4px 8px; text-align:right;">${fmt(vat)}</td></tr>` : ''}
          <tr style="border-top:2px solid #166534; font-weight:700; color:#15803d; font-size:11pt;">
            <td style="padding:6px 8px;">ยอดรวมทั้งสิ้น</td><td style="padding:6px 8px; text-align:right;">${fmt(grand)} บาท</td>
          </tr>
        </table>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:50px; font-size:9.5pt;">
        <div style="text-align:center; width:45%;">
          <div style="border-bottom:1px solid #999; margin-bottom:6px; height:40px;"></div>
          ผู้เสนอราคา<br>วันที่ ................................
        </div>
        <div style="text-align:center; width:45%;">
          <div style="border-bottom:1px solid #999; margin-bottom:6px; height:40px;"></div>
          ผู้อนุมัติสั่งซื้อ<br>วันที่ ................................
        </div>
      </div>

      <div style="margin-top:30px; text-align:center; font-size:8pt; color:#9ab89a;">
        ใบเสนอราคานี้พิมพ์จากระบบ Advance Plus CRM | ผู้พิมพ์: ${auth.currentUser?.email || 'System'} | เมื่อ: ${new Date().toLocaleString('th-TH')}
      </div>
    </div>
  `;

  printToPDF(bodyHTML, `Quotation_${quoteNo}`, 'portrait');
}

// ── เปิดหน้าต่างพิมพ์ (window.print) ด้วย DOM API แทน document.write ──
function printToPDF(bodyHTML, docName, orientation){
  const printWin = window.open('about:blank', '_blank');
  if (!printWin) {
    toast('⚠️ เบราว์เซอร์บล็อกป๊อปอัพ กรุณาอนุญาตป๊อปอัพสำหรับเว็บนี้แล้วลองใหม่');
    return;
  }
  const pdoc = printWin.document;
  pdoc.title = docName;

  const meta = pdoc.createElement('meta');
  meta.setAttribute('charset','UTF-8');
  pdoc.head.appendChild(meta);

  const style = pdoc.createElement('style');
  style.textContent = `
    @page { size: A4 ${orientation||'portrait'}; margin: 10mm; }
    * { box-sizing: border-box; }
    body { font-family: Tahoma, 'Leelawadee UI', Arial, sans-serif; margin:0; color:#1a2e1a; }
    table { width:100%; border-collapse:collapse; }
  `;
  pdoc.head.appendChild(style);
  pdoc.body.innerHTML = bodyHTML;

  const triggerPrint = () => { printWin.focus(); printWin.print(); };
  if (pdoc.fonts && pdoc.fonts.ready) {
    pdoc.fonts.ready.then(() => setTimeout(triggerPrint, 300));
  } else {
    setTimeout(triggerPrint, 700);
  }
  toast('✅ เปิดหน้าต่างพิมพ์แล้ว กรุณาเลือกปลายทางเป็น "Save as PDF"');
}
