<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กรอกหลายราย — Advance Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:#16a34a; --accent-dk:#14532d; --accent-lt:#22c55e; --accent-xlt:#dcfce7;
      --g-md:#16a34a; --g-dk:#14532d; --g-lt:#22c55e;
      --card-bg:#ffffff; --txt:#14532d; --txt-md:#166534; --txt-dim:#86efac;
      --border:rgba(134,239,172,.7); --inp-bg:#f0fdf4;
      --shadow:0 4px 20px rgba(22,101,52,.10); --shadow-sm:0 2px 8px rgba(22,101,52,.08);
      --red:#dc2626; --red-pale:#fef2f2; --orange:#ea580c;
      --sec-div:#dcfce7; --sec-icon-bg:#dcfce7;
    }
    [data-theme="dark"] {
      --card-bg:#234535; --txt:#ecfdf5; --txt-md:#bbf7d0; --txt-dim:#6ee7b7;
      --border:rgba(110,231,183,.3); --inp-bg:#1f4530;
      --shadow:0 4px 24px rgba(0,0,0,.28); --shadow-sm:0 2px 8px rgba(0,0,0,.2);
      --red:#fca5a5; --red-pale:#3b1a1a; --orange:#fdba74;
      --sec-div:rgba(110,231,183,.15); --sec-icon-bg:rgba(74,222,128,.1);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Kanit',sans-serif;
      background:linear-gradient(150deg,#f0fdf4,#dcfce7,#bbf7d0);
      background-attachment:fixed;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:0 0 6rem; color:var(--txt); transition:color .3s;
    }

    /* ── TOPBAR ── */
    .topbar {
      width:100%; background:rgba(0,0,0,.54); backdrop-filter:blur(14px);
      padding:.65rem 1.2rem; display:flex; align-items:center; gap:.6rem;
      position:sticky; top:0; z-index:100; border-bottom:1px solid rgba(255,255,255,.07);
    }
    .topbar img { height:30px; width:auto; object-fit:contain; }
    .tb-title { font-size:.9rem; font-weight:700; color:#fff; flex:1; }
    .tb-btn {
      font-size:.72rem; font-weight:600; padding:.28rem .72rem; border-radius:20px;
      border:1px solid rgba(255,255,255,.22); color:rgba(255,255,255,.85);
      background:rgba(255,255,255,.1); text-decoration:none;
      cursor:pointer; font-family:'Kanit',sans-serif; white-space:nowrap;
      transition:all .2s;
    }
    .tb-btn:hover { background:rgba(255,255,255,.22); color:#fff; }
    .tb-btn.red { color:#fca5a5; background:rgba(220,38,38,.15); border-color:rgba(220,38,38,.3); }
    .tb-btn.red:hover { background:rgba(220,38,38,.3); color:#fff; }
    .tb-count {
      font-size:.72rem; font-weight:700; padding:.28rem .72rem; border-radius:20px;
      background:rgba(56,192,102,.25); color:#fff; border:1px solid rgba(56,192,102,.4);
      white-space:nowrap;
    }

    /* ── PAGE ── */
    .page { width:100%; max-width:680px; padding:1.4rem 1rem 0; }

    /* ── PAGE HEADER ── */
    .page-header {
      background:var(--card-bg); border-radius:18px;
      border:1px solid var(--sec-div); box-shadow:var(--shadow);
      padding:1.2rem 1.5rem; margin-bottom:1.2rem;
      display:flex; align-items:center; gap:1rem;
      transition:background .4s;
    }
    .page-header-icon { font-size:2rem; flex-shrink:0; }
    .page-header h1 { font-size:1.1rem; font-weight:800; color:var(--txt); }
    .page-header p { font-size:.78rem; color:var(--txt-dim); margin-top:.18rem; }
    .header-counter {
      margin-left:auto; text-align:center; flex-shrink:0;
    }
    .counter-num { font-size:1.8rem; font-weight:800; color:var(--g-md); line-height:1; }
    .counter-lbl { font-size:.62rem; color:var(--txt-dim); letter-spacing:.06em; text-transform:uppercase; }

    /* ── ENTRY CARDS ── */
    #entriesWrap { display:flex; flex-direction:column; gap:1rem; }

    .entry-card {
      background:var(--card-bg); border-radius:18px;
      border:1.5px solid var(--sec-div); box-shadow:var(--shadow);
      overflow:hidden; transition:background .4s, border-color .3s, box-shadow .3s;
      animation:cardIn .35s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px) scale(.98);} to{opacity:1;transform:none;} }

    /* Color stripe per card */
    .entry-card::before {
      content:''; display:block; height:4px;
      background:linear-gradient(90deg, var(--accent-dk), var(--accent-lt));
    }
    .entry-card.done { border-color:rgba(34,197,94,.5); }
    .entry-card.done::before { background:linear-gradient(90deg,#15803d,#4ade80); }
    .entry-card.error { border-color:rgba(220,38,38,.5); }
    .entry-card.error::before { background:linear-gradient(90deg,#dc2626,#f87171); }
    .entry-card.sending { opacity:.75; pointer-events:none; }

    .card-header {
      display:flex; align-items:center; gap:.6rem;
      padding:.75rem 1.2rem .6rem;
      border-bottom:1px solid var(--sec-div);
    }
    .card-num {
      width:26px; height:26px; border-radius:50%;
      background:linear-gradient(135deg,var(--accent-dk),var(--accent));
      color:#fff; font-size:.78rem; font-weight:800;
      display:grid; place-items:center; flex-shrink:0;
    }
    .card-title { font-size:.82rem; font-weight:700; color:var(--txt-md); flex:1; }
    .card-status { font-size:.72rem; font-weight:600; }
    .card-status.ok   { color:#16a34a; }
    .card-status.err  { color:var(--red); }
    .card-status.wait { color:var(--txt-dim); }
    .btn-del {
      width:28px; height:28px; border-radius:8px; border:none;
      background:var(--red-pale); color:var(--red);
      cursor:pointer; font-size:.9rem; display:grid; place-items:center;
      transition:all .2s; flex-shrink:0;
    }
    .btn-del:hover { background:var(--red); color:#fff; }

    .card-body { padding:.9rem 1.2rem 1.1rem; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
    @media(max-width:480px) { .row-2 { grid-template-columns:1fr; } }
    .fg { margin-bottom:.7rem; }
    .fg:last-child { margin-bottom:0; }
    label { display:block; font-size:.75rem; font-weight:600; color:var(--txt-md); margin-bottom:.28rem; }
    label .req { color:var(--red); margin-left:2px; }
    label .opt { font-size:.6rem; padding:1px 6px; border-radius:20px; background:var(--sec-icon-bg); color:var(--g-md); border:1px solid var(--sec-div); margin-left:4px; font-weight:700; }

    .inp-w { position:relative; }
    .inp-ico { position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:var(--txt-dim); pointer-events:none; }
    .inp-ico.top { top:.75rem; transform:none; }

    input[type=text],input[type=tel],textarea,select {
      width:100%; background:var(--inp-bg); border:1.5px solid var(--border);
      border-radius:10px; color:var(--txt);
      font-family:'Kanit',sans-serif; font-size:.86rem; font-weight:400;
      padding:.58rem .8rem .58rem 2.2rem; outline:none;
      transition:border .2s, box-shadow .2s, background .25s;
      appearance:none; -webkit-appearance:none;
    }
    input[type=text],input[type=tel],select { height:40px; }
    textarea { padding:.58rem .8rem .58rem 2.2rem; resize:vertical; min-height:70px; line-height:1.6; }
    input:focus,textarea:focus,select:focus {
      border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.13);
      background:rgba(239,246,255,.45);
    }
    [data-theme="dark"] input:focus,[data-theme="dark"] textarea:focus,[data-theme="dark"] select:focus {
      background:rgba(37,99,235,.18); color:#dbeafe;
    }
    input::placeholder,textarea::placeholder { color:var(--txt-dim); opacity:.55; font-weight:300; }
    select option { background:var(--card-bg); color:var(--txt); }
    .sel-arrow { position:absolute; right:.75rem; top:50%; transform:translateY(-50%); color:var(--g-md); font-size:.8rem; pointer-events:none; }

    /* Phone row */
    .phone-row { display:flex; gap:.45rem; }
    .phone-pre {
      width:64px; flex-shrink:0; height:40px;
      background:var(--inp-bg); border:1.5px solid var(--border);
      border-radius:10px; color:var(--txt);
      font-family:'Kanit',sans-serif; font-size:.8rem; font-weight:700;
      text-align:center; padding:0 .35rem;
      cursor:pointer; outline:none; appearance:auto;
      transition:border .2s;
    }
    .phone-pre:focus { border-color:#3b82f6; }
    .phone-main { flex:1; position:relative; }
    .phone-main input { width:100%; }

    /* Progress dots under phone */
    .phone-dots { display:flex; gap:2px; margin-top:.25rem; height:3px; }
    .phone-dot { flex:1; border-radius:2px; background:var(--sec-div); transition:background .15s; }

    /* ── ADD BUTTON ── */
    .btn-add {
      width:100%; padding:.9rem;
      background:transparent; border:2px dashed var(--border);
      border-radius:18px; color:var(--txt-mid); cursor:pointer;
      font-family:'Kanit',sans-serif; font-size:.92rem; font-weight:700;
      letter-spacing:.04em; display:flex; align-items:center; justify-content:center; gap:.5rem;
      transition:all .25s; margin-top:.2rem;
    }
    .btn-add:hover {
      border-color:var(--g-md); color:var(--g-md);
      background:rgba(22,163,74,.06); transform:translateY(-1px);
    }
    .btn-add .plus { font-size:1.3rem; line-height:1; }

    /* ── SUBMIT FOOTER ── */
    .submit-footer {
      position:sticky; bottom:0; z-index:50;
      background:rgba(255,255,255,.92); backdrop-filter:blur(16px);
      border-top:1px solid var(--sec-div);
      padding:.85rem 1.2rem; margin:0 -1rem;
      display:flex; align-items:center; gap:.75rem;
      width:calc(100% + 2rem);
    }
    [data-theme="dark"] .submit-footer {
      background:rgba(30,60,40,.92);
      border-top-color:rgba(110,231,183,.15);
    }
    .footer-info { flex:1; }
    .footer-info-num { font-size:1rem; font-weight:800; color:var(--g-md); }
    .footer-info-lbl { font-size:.68rem; color:var(--txt-dim); }
    .btn-submit-all {
      padding:.72rem 1.6rem;
      background:linear-gradient(135deg,var(--accent-dk),var(--g-md) 55%,var(--accent-lt));
      border:none; border-radius:12px; color:#fff;
      font-family:'Kanit',sans-serif; font-size:.95rem; font-weight:800;
      letter-spacing:.06em; cursor:pointer;
      transition:transform .2s, box-shadow .2s;
      position:relative; overflow:hidden; flex-shrink:0;
    }
    .btn-submit-all::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent); transform:translateX(-100%); transition:transform .5s; }
    .btn-submit-all:not(:disabled):hover::after { transform:translateX(100%); }
    .btn-submit-all:not(:disabled):hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(22,101,52,.3); }
    .btn-submit-all:disabled { opacity:.5; cursor:not-allowed; }
    .btn-clear {
      padding:.72rem 1rem; border-radius:12px;
      border:1.5px solid var(--sec-div); background:var(--inp-bg);
      color:var(--txt-dim); font-family:'Kanit',sans-serif; font-size:.82rem; font-weight:700;
      cursor:pointer; transition:all .2s; flex-shrink:0;
    }
    .btn-clear:hover { border-color:var(--red); color:var(--red); background:var(--red-pale); }

    /* ── RESULT SUMMARY ── */
    .result-bar {
      display:none; padding:.7rem 1.2rem; border-radius:12px;
      margin-bottom:.8rem; font-size:.82rem; font-weight:600;
      animation:popIn .3s ease;
    }
    .result-bar.ok-bar { background:#f0fdf4; border:1.5px solid #86efac; color:#15803d; }
    .result-bar.err-bar { background:var(--red-pale); border:1.5px solid #fca5a5; color:var(--red); }
    .result-bar.mix-bar { background:#fffbeb; border:1.5px solid #fde68a; color:#92400e; }
    [data-theme="dark"] .ok-bar { background:#1a3a28; color:#4ade80; }
    [data-theme="dark"] .mix-bar { background:#2a2010; color:#fde68a; border-color:#fde68a; }
    @keyframes popIn { from{opacity:0;transform:scale(.96);} to{opacity:1;transform:scale(1);} }

    /* Spinner */
    .spinner { display:inline-block; width:13px; height:13px; border:2.5px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* FAB */
    .fab {
      position:fixed; bottom:1.6rem; right:1.6rem; z-index:999;
      width:48px; height:48px; border-radius:50%; border:none; cursor:pointer;
      display:grid; place-items:center; font-size:1.2rem;
      transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, background .4s;
    }
    [data-theme="light"] .fab { background:linear-gradient(135deg,#1e3a5f,#1e40af); color:#fde68a; box-shadow:0 4px 18px rgba(30,58,138,.38); }
    [data-theme="dark"]  .fab { background:linear-gradient(135deg,#fef08a,#fbbf24); color:#1c1917; box-shadow:0 4px 18px rgba(251,191,36,.38); }
    .fab:hover { transform:scale(1.12) rotate(14deg); }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <img src="img/logo.png" alt="logo" onerror="this.style.display='none'">
  <span class="tb-title">Advance Plus</span>
  <a href="index.html" class="tb-btn">📋 กรอกรายเดียว</a>
  <a href="profile.html" class="tb-btn" id="userBadge">👤 ...</a>
  <button class="tb-btn red" onclick="doLogout()">ออกจากระบบ</button>
</div>

<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="page-header-icon">📋</div>
    <div>
      <h1>กรอกข้อมูลหลายราย</h1>
      <p>เพิ่มลูกค้าได้ทีละหลายคน แล้วส่งพร้อมกันทีเดียว</p>
    </div>
    <div class="header-counter">
      <div class="counter-num" id="counterNum">1</div>
      <div class="counter-lbl">รายการ</div>
    </div>
  </div>

  <!-- RESULT BAR -->
  <div class="result-bar" id="resultBar"></div>

  <!-- ENTRIES -->
  <div id="entriesWrap"></div>

  <!-- ADD BUTTON -->
  <button class="btn-add" onclick="addEntry()">
    <span class="plus">＋</span> เพิ่มลูกค้ารายถัดไป
  </button>

  <!-- SUBMIT FOOTER -->
  <div class="submit-footer">
    <div class="footer-info">
      <div class="footer-info-num" id="footerCount">1 รายการ</div>
      <div class="footer-info-lbl">พร้อมส่ง</div>
    </div>
    <button class="btn-clear" onclick="confirmClear()" title="ล้างทั้งหมด">🗑️ ล้าง</button>
    <button class="btn-submit-all" id="btnSubmitAll" onclick="submitAll()">
      ✦ ส่งทั้งหมด
    </button>
  </div>

</div><!-- /page -->

<button class="fab" id="themeFab" onclick="THEME.toggle()">🌙</button>

<script src="theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
/* ════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyUzM846I6-IvEm4l5Tf-pNyJuiiRLNzc37xHzioa2_wtmNeVeUChckI_EMxR7DfPE/exec';

const ENTRY_IDS = {
  name:'entry.764394629', type:'entry.70047548', phone:'entry.947159021',
  problem:'entry.362559973', progress:'entry.2129760952',
  action:'entry.1442518177', result:'entry.1907054483',
};
const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfC4c8etCZJN3nm5EqHTHa9zP1vZe0O1EC_rUbtfexI9EPczg/formResponse';

/* ════════════════════════════════════════════
   FIREBASE AUTH
════════════════════════════════════════════ */
firebase.initializeApp({
  apiKey:"AIzaSyDgyBh_OWjnIpok3gR9LUsT0CAqGK6FVao",
  authDomain:"advance-plus-form.firebaseapp.com",
  projectId:"advance-plus-form",
  storageBucket:"advance-plus-form.firebasestorage.app",
  messagingSenderId:"130477031774",
  appId:"1:130477031774:web:09345e091812be63d04fcf"
});
const auth = firebase.auth();
auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = 'login.html'; return; }
  const name = user.displayName || user.email.split('@')[0];
  document.getElementById('userBadge').textContent = '👤 ' + name;
});
async function doLogout() { await auth.signOut(); window.location.href='login.html'; }

/* ════════════════════════════════════════════
   ENTRY MANAGEMENT
════════════════════════════════════════════ */
let entries = [];   // [{id, el, status:'idle'|'sending'|'done'|'error'|'skip'}]
let entryCounter = 0;

function addEntry(data = {}) {
  entryCounter++;
  const id = entryCounter;
  const card = buildCard(id, data);
  document.getElementById('entriesWrap').appendChild(card);
  entries.push({ id, el: card, status: 'idle' });
  updateCounters();
  // Smooth scroll to new card
  setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
  return card;
}

function removeEntry(id) {
  const idx = entries.findIndex(e => e.id === id);
  if (idx === -1) return;
  if (entries.length === 1) { alert('ต้องมีอย่างน้อย 1 รายการ'); return; }
  const card = entries[idx].el;
  card.style.animation = 'none';
  card.style.transition = 'all .25s ease';
  card.style.opacity = '0';
  card.style.transform = 'scale(.95) translateY(-8px)';
  setTimeout(() => { card.remove(); }, 240);
  entries.splice(idx, 1);
  updateCounters();
}

function buildCard(id, data = {}) {
  const card = document.createElement('div');
  card.className = 'entry-card';
  card.id = 'card-' + id;
  card.innerHTML = `
    <div class="card-header">
      <div class="card-num">${id}</div>
      <span class="card-title" id="ctitle-${id}">ลูกค้ารายที่ ${id}</span>
      <span class="card-status wait" id="cstatus-${id}">ยังไม่ส่ง</span>
      <button class="btn-del" onclick="removeEntry(${id})" title="ลบรายการนี้">✕</button>
    </div>
    <div class="card-body">
      <div class="row-2">
        <!-- ชื่อ -->
        <div class="fg">
          <label>ชื่อ <span class="req">*</span></label>
          <div class="inp-w">
            <svg class="inp-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input type="text" id="name-${id}" placeholder="ชื่อลูกค้า" autocomplete="off"
              oninput="updateCardTitle(${id})">
          </div>
        </div>
        <!-- ประเภท -->
        <div class="fg">
          <label>ประเภท <span class="req">*</span></label>
          <div class="inp-w">
            <svg class="inp-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h12M4 14h8"/></svg>
            <select id="type-${id}">
              <option value="" disabled selected>เลือกประเภท</option>
              <option value="CI1">CI1</option><option value="CI2">CI2</option>
              <option value="CS1">CS1</option><option value="CS2">CS2</option>
              <option value="CW">CW</option><option value="CH">CH</option>
              <option value="CR">CR</option>
            </select>
            <span class="sel-arrow">▾</span>
          </div>
        </div>
      </div>

      <!-- เบอร์โทร -->
      <div class="fg">
        <label>เบอร์โทรศัพท์ <span class="req">*</span></label>
        <div class="phone-row">
          <select class="phone-pre" id="prefix-${id}">
            <option value="">—</option>
            <option value="CI">CI</option><option value="CS">CS</option>
            <option value="CW">CW</option><option value="CH">CH</option><option value="CR">CR</option>
          </select>
          <div class="phone-main">
            <svg class="inp-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
            <input type="tel" id="phone-${id}" placeholder="0XXXXXXXXX" maxlength="10" inputmode="numeric"
              oninput="phoneInput(${id}, this)">
          </div>
        </div>
        <div class="phone-dots" id="dots-${id}">
          ${Array(10).fill('<div class="phone-dot"></div>').join('')}
        </div>
      </div>

      <!-- ปัญหา -->
      <div class="fg">
        <label>ปัญหา <span class="req">*</span></label>
        <div class="inp-w">
          <svg class="inp-ico top" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <textarea id="problem-${id}" placeholder="อธิบายปัญหา..." rows="2"></textarea>
        </div>
      </div>

      <div class="row-2">
        <!-- ความคืบหน้า -->
        <div class="fg">
          <label>ความคืบหน้า <span class="req">*</span></label>
          <div class="inp-w">
            <svg class="inp-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <select id="progress-${id}">
              <option value="" disabled selected>เลือกสถานะ</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="อยู่ระหว่างดำเนินงาน">อยู่ระหว่างดำเนินงาน</option>
              <option value="รอลูกค้าตอบกลับ">รอลูกค้าตอบกลับ</option>
              <option value="ไม่สำเร็จ">ไม่สำเร็จ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
            <span class="sel-arrow">▾</span>
          </div>
        </div>
        <!-- ผล -->
        <div class="fg">
          <label>ผล <span class="opt">ไม่บังคับ</span></label>
          <div class="inp-w">
            <svg class="inp-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <select id="result-${id}">
              <option value="">— ไม่ระบุ —</option>
              <option value="จบงานเรียบร้อยแล้ว">✅ จบงานเรียบร้อยแล้ว</option>
              <option value="ตัดออก">❌ ตัดออก</option>
            </select>
            <span class="sel-arrow">▾</span>
          </div>
        </div>
      </div>

      <!-- การดำเนินการ -->
      <div class="fg">
        <label>การดำเนินการ <span class="req">*</span></label>
        <div class="inp-w">
          <svg class="inp-ico top" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <textarea id="action-${id}" placeholder="อธิบายการดำเนินการ..." rows="2"></textarea>
        </div>
      </div>
    </div>
  `;

  // Fill prefilled data
  if (data.name)     card.querySelector(`#name-${id}`).value     = data.name;
  if (data.type)     card.querySelector(`#type-${id}`).value     = data.type;
  if (data.prefix)   card.querySelector(`#prefix-${id}`).value   = data.prefix;
  if (data.phone)    card.querySelector(`#phone-${id}`).value    = data.phone;
  if (data.problem)  card.querySelector(`#problem-${id}`).value  = data.problem;
  if (data.progress) card.querySelector(`#progress-${id}`).value = data.progress;
  if (data.action)   card.querySelector(`#action-${id}`).value   = data.action;
  if (data.result)   card.querySelector(`#result-${id}`).value   = data.result;

  // Phone keyboard filter
  card.querySelector(`#phone-${id}`).addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) return;
    if (!['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(e.key) && !/^\d$/.test(e.key))
      e.preventDefault();
  });

  return card;
}

/* ── Update card title from name field ── */
function updateCardTitle(id) {
  const name = document.getElementById(`name-${id}`)?.value.trim();
  const t = document.getElementById(`ctitle-${id}`);
  if (t) t.textContent = name || `ลูกค้ารายที่ ${id}`;
}

/* ── Phone input + dots ── */
const DOT_COLORS = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#22c55e','#16a34a','#15803d','#166534'];
function phoneInput(id, el) {
  el.value = el.value.replace(/\D/g,'').slice(0,10);
  const len = el.value.length;
  const dots = document.querySelectorAll(`#dots-${id} .phone-dot`);
  dots.forEach((d,i) => { d.style.background = i < len ? DOT_COLORS[i] : ''; });
}

/* ── Update counters ── */
function updateCounters() {
  const n = entries.length;
  document.getElementById('counterNum').textContent = n;
  document.getElementById('footerCount').textContent = n + ' รายการ';
  // Re-number card headers
  entries.forEach((e,i) => {
    const numEl = e.el.querySelector('.card-num');
    if (numEl) numEl.textContent = i + 1;
  });
}

/* ── Collect data from one card ── */
function collectCard(id) {
  const get = s => document.getElementById(s+'-'+id)?.value ?? '';
  const prefix = get('prefix');
  const rawPhone = get('phone').trim();
  return {
    name:     get('name').trim(),
    type:     get('type'),
    phone:    (prefix ? prefix : '') + rawPhone,
    rawPhone,
    problem:  get('problem').trim(),
    progress: get('progress'),
    action:   get('action').trim(),
    result:   get('result'),
  };
}

/* ── Validate one card ── */
function validateCard(id, data) {
  const errs = [];
  if (!data.name)       errs.push('ชื่อ');
  if (!data.type)       errs.push('ประเภท');
  if (!data.rawPhone || data.rawPhone.length !== 10) errs.push('เบอร์โทร 10 หลัก');
  if (!data.problem)    errs.push('ปัญหา');
  if (!data.progress)   errs.push('ความคืบหน้า');
  if (!data.action)     errs.push('การดำเนินการ');
  return errs;
}

/* ── Set card status ── */
function setCardStatus(id, status, msg) {
  const card   = document.getElementById('card-'+id);
  const statEl = document.getElementById('cstatus-'+id);
  if (!card || !statEl) return;
  card.className = 'entry-card ' + (status==='done'?'done':status==='error'?'error':status==='sending'?'sending':'');
  statEl.className = 'card-status ' + (status==='done'?'ok':status==='error'?'err':'wait');
  const icons = {done:'✅ ส่งแล้ว', error:'❌ ' + (msg||'ผิดพลาด'), sending:'⏳ กำลังส่ง...', skip:'⚠️ ข้ามไป', idle:'ยังไม่ส่ง'};
  statEl.textContent = icons[status] || msg || '—';
}

/* ════════════════════════════════════════════
   SUBMIT ALL
════════════════════════════════════════════ */
let isSubmitting = false;

async function submitAll() {
  if (isSubmitting) return;

  // Validate all
  let hasError = false;
  entries.forEach(e => {
    const data = collectCard(e.id);
    const errs = validateCard(e.id, data);
    if (errs.length > 0) {
      setCardStatus(e.id, 'error', 'กรุณากรอก: ' + errs.join(', '));
      // Scroll to first error
      if (!hasError) e.el.scrollIntoView({ behavior:'smooth', block:'center' });
      hasError = true;
    } else {
      setCardStatus(e.id, 'idle');
    }
  });
  if (hasError) return;

  isSubmitting = true;
  const btn = document.getElementById('btnSubmitAll');
  btn.innerHTML = '<span class="spinner"></span>กำลังส่ง...';
  btn.disabled = true;
  document.getElementById('resultBar').style.display = 'none';

  let done = 0, errCount = 0;
  const total = entries.length;

  /* Send one by one — sequential to avoid rate limit */
  for (const entry of entries) {
    const data = collectCard(entry.id);
    setCardStatus(entry.id, 'sending');

    try {
      // ✅ ส่งไป Apps Script อย่างเดียว (แก้ปัญหาข้อมูลซ้ำ)
      const body = {
        name:data.name, type:data.type, phone:data.phone,
        problem:data.problem, progress:data.progress,
        action:data.action, result:data.result
      };
      await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
        mode:'no-cors'
      });

      setCardStatus(entry.id, 'done');
      entry.status = 'done';
      done++;

      // Small delay between requests to avoid hitting rate limits
      if (entries.indexOf(entry) < entries.length - 1) {
        btn.innerHTML = `<span class="spinner"></span>ส่งแล้ว ${done}/${total}...`;
        await new Promise(r => setTimeout(r, 350));
      }

    } catch (err) {
      setCardStatus(entry.id, 'error', 'network error');
      entry.status = 'error';
      errCount++;
    }
  }

  /* ── Result summary ── */
  const bar = document.getElementById('resultBar');
  if (errCount === 0) {
    bar.className = 'result-bar ok-bar';
    bar.innerHTML = `✅ ส่งข้อมูลครบ ${done} รายการเรียบร้อยแล้ว! 🎉`;
    bar.style.display = 'block';
    btn.innerHTML = `✓ ส่งแล้ว ${done} ราย`;
    btn.style.background = 'linear-gradient(135deg,#0a4a1e,#157535)';
    // Auto reset after 4s
    setTimeout(() => {
      resetAllCards();
      btn.innerHTML = '✦ ส่งทั้งหมด';
      btn.style.background = '';
      btn.disabled = false;
      bar.style.display = 'none';
      isSubmitting = false;
    }, 4000);
  } else if (done === 0) {
    bar.className = 'result-bar err-bar';
    bar.innerHTML = `❌ ส่งไม่สำเร็จทั้งหมด กรุณาลองใหม่`;
    bar.style.display = 'block';
    btn.innerHTML = '⚠ ลองใหม่';
    btn.style.background = 'linear-gradient(135deg,#9a2020,#c43030)';
    btn.disabled = false;
    isSubmitting = false;
    setTimeout(() => { btn.innerHTML='✦ ส่งทั้งหมด'; btn.style.background=''; }, 3000);
  } else {
    bar.className = 'result-bar mix-bar';
    bar.innerHTML = `⚡ ส่งสำเร็จ ${done} ราย | ไม่สำเร็จ ${errCount} ราย — กด "ส่งทั้งหมด" อีกครั้งเพื่อส่งที่ค้างอยู่`;
    bar.style.display = 'block';
    // Remove done entries, keep error ones
    entries.filter(e => e.status === 'done').forEach(e => {
      e.el.style.opacity = '0.5';
      e.el.style.pointerEvents = 'none';
    });
    btn.innerHTML = `↺ ส่งที่เหลือ (${errCount} ราย)`;
    btn.disabled = false;
    isSubmitting = false;
  }
}

/* ── Reset all cards to idle ── */
function resetAllCards() {
  entries.forEach(e => {
    e.status = 'idle';
    e.el.className = 'entry-card';
    // Clear inputs
    ['name','type','phone','prefix','problem','progress','action','result'].forEach(f => {
      const el = document.getElementById(f+'-'+e.id);
      if (el) { el.value = f === 'type' || f === 'progress' || f === 'result' ? '' : ''; }
    });
    // Reset phone dots
    e.el.querySelectorAll('.phone-dot').forEach(d => d.style.background = '');
    setCardStatus(e.id, 'idle');
    updateCardTitle(e.id);
  });
}

/* ── Confirm clear ── */
function confirmClear() {
  if (!confirm(`ล้างข้อมูลทั้งหมด ${entries.length} รายการ? ยืนยัน`)) return;
  document.getElementById('entriesWrap').innerHTML = '';
  entries = [];
  entryCounter = 0;
  document.getElementById('resultBar').style.display = 'none';
  addEntry(); // start fresh with 1
}

/* ── Init ── */
addEntry();
</script>
